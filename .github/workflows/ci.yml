name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Headless snapshots
        continue-on-error: true
        run: .build/debug/AIPulseApp --snapshot snapshots
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots/

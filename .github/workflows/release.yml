name: Release

# Cuts a semver release with a downloadable app bundle whenever a PR merges
# into main. The bump level comes from PR labels (release:major /
# release:minor, default patch). workflow_dispatch cuts one on demand.
#
# CI has no signing identity, so release bundles are ad-hoc signed; the
# release notes carry the Gatekeeper first-launch instructions. When a
# Developer ID certificate is added as a secret later, signing +
# notarization steps can slot in before "Zip app bundle".

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history: the version is computed from tags

      - name: Compute next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          DISPATCH_BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            version="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            bump="${DISPATCH_BUMP:-patch}"
            case " $LABELS " in
              *" release:major "*) bump=major ;;
              *" release:minor "*) bump=minor ;;
            esac
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (from ${latest:-no previous tag})"

      - name: Build app bundle
        run: |
          AIPULSE_VERSION="${{ steps.version.outputs.version }}" AIPULSE_UNIVERSAL=1 ./Scripts/make-app.sh
          # Fail the release rather than ship a single-arch bundle.
          archs=$(lipo -archs "dist/AI Pulse.app/Contents/MacOS/AIPulse")
          echo "App architectures: $archs"
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "::error::expected universal binary, got: $archs"; exit 1 ;;
          esac

      - name: Zip app bundle
        run: ditto -c -k --keepParent "dist/AI Pulse.app" "AI-Pulse-${{ steps.version.outputs.version }}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "AI-Pulse-$VERSION.zip" \
            --title "AI Pulse $VERSION" \
            --generate-notes \
            --notes "$(cat <<'NOTES'
          **Install:** unzip, move `AI Pulse.app` to `/Applications`, and launch.
          The bundle is universal (Apple Silicon + Intel).
          These builds are not yet notarized, so on first launch macOS will warn
          about an unverified developer: right-click the app → **Open** (on
          macOS 15+, also allow it under **System Settings → Privacy & Security →
          Open Anyway**). The `aipulse` CLI is embedded at
          `AI Pulse.app/Contents/Helpers/aipulse`.

          NOTES
          )"
